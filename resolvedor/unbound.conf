# Unbound: resolvedor recursivo que valida DNSSEC

server:
    interface: 0.0.0.0
    access-control: 172.16.0.0/12 allow
    do-ip6: no
    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"

    # Âncoras de confiança: o ponto de partida da cadeia de confiança
    auto-trust-anchor-file: "/var/lib/unbound/root.key"   # raiz da internet (KSK-2024)
    trust-anchor-file: "/etc/unbound/lab/lab.ds"          # zona do laboratório (gerada na assinatura)

    # Endurecimento
    harden-dnssec-stripped: yes   # recusa resposta sem assinatura onde deveria haver
    use-caps-for-id: yes          # técnica 0x20: mistura maiúsculas e minúsculas no nome
    val-bogus-ttl: 10             # guarda respostas inválidas por só 10 s (facilita repetir a demo)

    # Logs para a demonstração (na saída padrão, para o docker compose logs)
    use-syslog: no
    logfile: ""
    verbosity: 1
    val-log-level: 2
    log-servfail: yes

# A zona lab.internal não existe na internet: dizemos ao Unbound quem responde por ela.
# Na vida real, quem diz isso é a zona pai, com os registros NS e DS.
stub-zone:
    name: "lab.internal"
    stub-addr: 172.20.0.10

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
